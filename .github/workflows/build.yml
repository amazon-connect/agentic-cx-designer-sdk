name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  generate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Smithy CLI
        run: |
          SMITHY_VERSION="1.72.0"
          curl -sL "https://github.com/smithy-lang/smithy/releases/download/${SMITHY_VERSION}/smithy-cli-linux-x86_64.zip" -o smithy-cli.zip
          unzip -q smithy-cli.zip -d smithy-cli
          echo "$PWD/smithy-cli/bin" >> $GITHUB_PATH

      - name: Verify Smithy CLI
        run: smithy --version

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Generate TypeScript client
        run: smithy build --config smithy-build.github.json

      - name: Install generated client dependencies
        working-directory: build/smithy/typescript-client/typescript-codegen
        run: npm install

      - name: Build generated client
        working-directory: build/smithy/typescript-client/typescript-codegen
        run: npm run build

      - name: Verify generated client
        working-directory: build/smithy/typescript-client/typescript-codegen
        run: |
          echo "=== Package info ==="
          node -e "const p = require('./package.json'); console.log(p.name, p.version)"
          echo "=== Generated files ==="
          ls -la src/ | head -20
          echo "=== Commands ==="
          ls src/commands/ | head -20
