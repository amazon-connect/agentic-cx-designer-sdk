name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: npm-publish
      url: https://www.npmjs.com/package/amazon-connect-acxd-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Smithy CLI
        run: |
          SMITHY_VERSION="1.72.0"
          curl -sL "https://github.com/smithy-lang/smithy/releases/download/${SMITHY_VERSION}/smithy-cli-linux-x86_64.zip" -o smithy-cli.zip
          unzip -q smithy-cli.zip
          echo "$PWD/smithy-cli-linux-x86_64/bin" >> $GITHUB_PATH

      - name: Verify Smithy CLI
        run: smithy --version

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure npm 11.5.1+ for trusted publishing
        run: |
          echo "Current npm version: $(npm --version)"
          npm install -g npm@11.5.1
          echo "Updated npm version: $(npm --version)"

      - name: Generate TypeScript client
        run: smithy build --config smithy-build.json

      - name: Inject SDK client wrapper
        run: node scripts/inject-wrapper.mjs

      - name: Inject release version into package.json
        if: github.event_name == 'release'
        working-directory: build/smithy/typescript-client/typescript-codegen
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Setting package version to: $VERSION"
          npm version "$VERSION" --no-git-tag-version

      - name: Install dependencies
        working-directory: build/smithy/typescript-client/typescript-codegen
        run: npm install

      - name: Build
        working-directory: build/smithy/typescript-client/typescript-codegen
        run: npm run build

      - name: Publish dry-run
        working-directory: build/smithy/typescript-client/typescript-codegen
        run: npm publish --access public --provenance --dry-run

      - name: Publish to npm (using OIDC trusted publishing)
        if: github.event_name == 'release'
        working-directory: build/smithy/typescript-client/typescript-codegen
        run: |
          echo "Publishing with OIDC trusted publishing..."
          echo "No NPM_TOKEN needed - using GitHub OIDC"
          npm publish --access public --provenance
