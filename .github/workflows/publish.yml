name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: npm-publish
      url: https://www.npmjs.com/package/@amazon-connect/agentic-cx-designer-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Smithy CLI
        uses: smithy-lang/setup-smithy-cli@1c53b1041a109add89a70b3c9bdc4be536a761e2 # v1
        with:
          version: '1.72.0'
          config: smithy-build.github.json

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure npm 11.5.1+ for trusted publishing
        run: |
          echo "Current npm version: $(npm --version)"
          npm install -g npm@11.5.1
          echo "Updated npm version: $(npm --version)"

      - name: Generate TypeScript client
        run: smithy build --config smithy-build.github.json

      - name: Inject release version into package.json
        if: github.event_name == 'release'
        working-directory: build/smithy/typescript-client/typescript-codegen
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Setting package version to: $VERSION"
          npm version "$VERSION" --no-git-tag-version

      - name: Install dependencies
        working-directory: build/smithy/typescript-client/typescript-codegen
        run: npm install

      - name: Build
        working-directory: build/smithy/typescript-client/typescript-codegen
        run: npm run build

      - name: Publish dry-run
        working-directory: build/smithy/typescript-client/typescript-codegen
        run: npm publish --access public --provenance --dry-run

      - name: Publish to npm (using OIDC trusted publishing)
        if: github.event_name == 'release'
        working-directory: build/smithy/typescript-client/typescript-codegen
        run: |
          echo "Publishing with OIDC trusted publishing..."
          echo "No NPM_TOKEN needed - using GitHub OIDC"
          npm publish --access public --provenance
